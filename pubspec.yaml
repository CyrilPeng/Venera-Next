name: venera_next
description: "A comic app."
publish_to: 'none'
homepage: https://github.com/CyrilPeng/venera-next
version: 1.18.3+245

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: 3.41.4

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  intl: ^0.20.2
  window_manager: ^0.5.2
  sqlite3: ^2.7.4
  sqlite3_flutter_libs: ^0.5.42
  flutter_qjs:
    git:
      url: https://github.com/CyrilPeng/flutter_qjs
      ref: 295f77421eedff356a02e92987181b525970c780
  crypto: ^3.0.8
  dio: ^5.11.1
  html: ^0.15.7
  pointycastle: ^4.0.0
  url_launcher: ^6.3.3
  path: ^1.9.0
  photo_view:
    path: packages/photo_view
  mime: ^2.1.0
  share_plus:
    path: packages/share_plus
  scrollable_positioned_list:
    path: packages/scrollable_positioned_list
  flutter_reorderable_grid_view: ^5.7.0
  uuid: ^4.6.0
  desktop_webview_window:
    path: packages/desktop_webview_window
  flutter_inappwebview:
    git:
      url: https://github.com/CyrilPeng/flutter_inappwebview
      path: flutter_inappwebview
      ref: 3ef899b3db57c911b080979f1392253b835f98ab
  app_links: ^7.0.0
  sliver_tools: ^0.2.12
  flutter_file_dialog: ^3.0.3
  file_selector: ^1.1.0
  zip_flutter: ^0.0.13
  venera_native:
    path: packages/venera_native
  rhttp:
    path: packages/rhttp
  flutter_rust_bridge: 2.11.1
  webdav_client:
    path: packages/webdav_client
  battery_plus: ^7.1.2
  local_auth: ^3.0.2
  venera_saf:
    path: packages/venera_saf
  dynamic_color: ^1.8.1
  shimmer_animation: ^2.1.0
  flutter_memory_info: ^0.0.3
  syntax_highlight: ^0.5.0
  flex_seed_scheme: ^4.0.1
  flutter_localizations:
    sdk: flutter
  yaml: ^3.1.4
  enough_convert: ^1.7.1
  display_mode: ^0.0.2
  flutter_staggered_grid_view: ^0.7.0
  archive: ^4.6.0
  image: ^4.12.0
  pdfrx: ^2.4.7
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_rust_bridge: 2.11.1

flutter:
  uses-material-design: true
  assets:
    - pubspec.yaml
    - CHANGELOG.md
    - assets/translation.json
    - assets/init.js
    - assets/app_icon.png
    - assets/tags.json
    - assets/tags_tw.json
    - assets/opencc.txt
# fonts:

# Metadata consumed by .github/scripts/build_arch_package.py (no Dart package required).
flutter_to_arch:
  name: venera-next
  icon: debian/gui/venera-next.png
  categories: Utility
  keywords: Flutter;comic;images;
  url: https://github.com/CyrilPeng/venera-next
  depends:
    - gtk3
    - webkit2gtk-4.1
