name: 更新 AltStore 源

on:
  workflow_run:
    workflows: ["完整构建"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: update-altstore
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'v') &&
          !contains(github.event.workflow_run.head_branch, '-')
        )
      }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: 记录任务开始时间
        id: job_start_time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: 更新 AltStore 源并创建 PR
        id: update_source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.ALTSTORE_PR_TOKEN || secrets.WINGET_PKGS_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::缺少 ALTSTORE_PR_TOKEN 或 WINGET_PKGS_TOKEN secret，无法创建或更新 AltStore PR。"
            exit 1
          fi
          python update_alt_store.py
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add alt_store.json
          if git diff --staged --quiet; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch_name="automation/update-altstore"
          git checkout -B "$branch_name"
          git commit -m "chore(altstore): 更新源至最新稳定版"
          git push --force-with-lease origin "$branch_name"

          pr_url=$(gh pr list \
            --head "$branch_name" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url')
          if [[ -z "$pr_url" ]]; then
            pr_url=$(gh pr create \
              --title "更新 AltStore 源到最新稳定版" \
              --body "此 PR 会把 alt_store.json 更新到最新稳定版发布信息。" \
              --head "$branch_name" \
              --base main)
          fi

          echo "changes=true" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: 计算任务耗时
        id: duration
        if: always()
        run: |
          end_time=$(date +%s)
          start_time="${{ steps.job_start_time.outputs.start_time }}"
          if [[ -n "$start_time" ]]; then
            echo "duration=$((end_time - start_time)) seconds" >> "$GITHUB_OUTPUT"
          else
            echo "duration=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成任务摘要
        if: always()
        run: |
          echo "## AltStore 源更新摘要" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.update_source.outcome }}" != "success" ]]; then
            echo "更新失败，请查看任务日志。" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.update_source.outputs.changes }}" == "true" ]]; then
            echo "已更新 alt_store.json 并准备拉取请求。" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "更新分支：\`${{ steps.update_source.outputs.branch_name }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "拉取请求：${{ steps.update_source.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "alt_store.json 已是最新，无需更新。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "任务耗时：${{ steps.duration.outputs.duration }}" >> "$GITHUB_STEP_SUMMARY"
