name: 漫画字幕设备试用
on:
  workflow_dispatch:
  push:
    branches: [test/comic-subtitles]
    paths:
      - '.github/workflows/subtitle-trial.yml'
      - 'tool/comic_subtitles/device_trial.dart'
      - 'tool/comic_subtitles/run_trial.py'
      - 'spec/comic-subtitles/fixtures/mountain-path-0.1.cbz'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python tool/comic_subtitles/run_trial.py prepare
      - run: flutter build windows --release --no-pub --target build/subtitle-trial/main.dart
      - name: 为试用进程保留原生故障现场
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\VeneraNext.exe'
          New-Item $key -Force | Out-Null
          New-ItemProperty $key -Name DumpFolder -Value (Resolve-Path build/subtitle-trial).Path -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
      - run: python tool/comic_subtitles/run_trial.py windows
      - name: 记录 Windows 故障模块
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
            Where-Object Message -match 'VeneraNext' | Format-List TimeCreated,Message |
            Out-File build/subtitle-trial/windows-events.log -Encoding utf8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: subtitle-trial-windows
          path: |
            build/subtitle-trial/report.json
            build/subtitle-trial/trial.log
            build/subtitle-trial/windows-events.log
            build/subtitle-trial/*.dmp

  android-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '17'
          cache: gradle
      - run: python3 .github/scripts/prepare_rust_toolchain.py --target aarch64-linux-android --target armv7-linux-androideabi --target x86_64-linux-android
      - name: 准备试用包签名
        run: |
          keytool -genkeypair -noprompt -keystore android/trial.keystore -storepass android -keypass android -alias trial -dname 'CN=Subtitle Trial' -keyalg RSA -validity 10
          printf '%s\n' 'storePassword=android' 'keyPassword=android' 'keyAlias=trial' 'storeFile=../trial.keystore' > android/key.properties
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/comic_subtitles/run_trial.py prepare
      - run: flutter build apk --release --flavor mobile --no-pub --target build/subtitle-trial/main.dart
      - run: python3 tool/comic_subtitles/run_trial.py select-apk
      - uses: actions/upload-artifact@v7
        with:
          name: subtitle-trial-emulator-apk
          path: build/subtitle-trial/trial.apk
          retention-days: 1

  android-offline:
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        memory: [1536, 3072]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: subtitle-trial-emulator-apk
          path: build/subtitle-trial
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: ${{ matrix.memory }}M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -lowram -memory ${{ matrix.memory }}
          script: python3 tool/comic_subtitles/run_trial.py android --memory-mib ${{ matrix.memory }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: subtitle-trial-android-${{ matrix.memory }}
          path: |
            build/subtitle-trial/report.json
            build/subtitle-trial/device.txt
            build/subtitle-trial/trial.log
