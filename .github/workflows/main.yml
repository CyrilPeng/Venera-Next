name: 完整构建
run-name: 完整构建 ${{ github.ref_name }}

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Release_Metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 校验发布标签元数据
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/validate_release.py
      - name: 校验分支构建元数据
        if: github.ref_type != 'tag'
        run: python3 .github/scripts/validate_release.py --build-only
      - name: 校验同提交鸿蒙来源与随版发布开关
        run: python3 .github/scripts/harmonyos_release.py config

  Quality:
    needs: Release_Metadata
    uses: ./.github/workflows/analyze.yml

  Build:
    needs: [Release_Metadata, Quality]
    uses: ./.github/workflows/build.yml
    with:
      quality_checked: true
      build_android: true
      build_windows: true
      build_macos: true
      build_ios: true
      build_linux_x64: true
      build_linux_arm64: true
    secrets: inherit

  HarmonyOS:
    needs: [Release_Metadata, Quality]
    uses: ./.github/workflows/harmonyos-release.yml

  Release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [Release_Metadata, Quality, Build, HarmonyOS]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: release-source
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: release-source
      - name: 校验发布元数据
        run: python3 .github/scripts/validate_release.py --write-notes ../release_notes.md
      - name: 读取同提交鸿蒙构建来源
        id: harmonyos_pin
        run: python3 .github/scripts/harmonyos_release.py config --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.harmonyos_pin.outputs.source_commit }}
          path: harmonyos-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: harmonyos-release
          path: outputs/harmonyos
      - name: 核验鸿蒙版本、源码、原生库及资产
        run: |
          python3 .github/scripts/harmonyos_release.py verify \
            --source-root ../harmonyos-source --artifacts ../outputs/harmonyos
      - uses: actions/download-artifact@v8
        with:
          name: macos_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: ios_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          path: outputs
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: tv-apk-*
          path: outputs
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: android-*-manifest
          path: outputs
          merge-multiple: true
      - name: 核验手机版与 TV 版完整性、签名及构建来源
        run: python3 .github/scripts/android_tv_build.py verify-release --directory ../outputs
      - uses: actions/download-artifact@v8
        with:
          name: windows_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: deb_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: arch_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: deb_arm64_build
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          pattern: linux_extra_*
          path: outputs
          merge-multiple: true
      - name: 生成 Winget Manifest
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/generate_winget_manifest.py \
            --version "$version" \
            --installer "../outputs/VeneraNext-${version}-windows-installer.exe" \
            --release-date "$(date -u +%F)" \
            --output ../outputs/winget \
            --print-path
      - uses: actions/upload-artifact@v7
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          name: winget_manifest
          path: outputs/winget/manifests
          if-no-files-found: error
          retention-days: 14
      - name: 创建草稿 Release 并上传资产
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(
            ../outputs/harmonyos/*
            ../outputs/*.ipa
            ../outputs/*.dmg
            ../outputs/*.apk
            ../outputs/android-*-manifest.json
            ../outputs/*.zip
            ../outputs/*.exe
            ../outputs/*.deb
            ../outputs/*.rpm
            ../outputs/*.zst
            ../outputs/*.AppImage
          )
          if (( ${#files[@]} == 0 )); then
            echo "没有找到可发布的构建产物。" >&2
            exit 1
          fi

          args=(
            --verify-tag
            --target "${GITHUB_SHA}"
            --title "${GITHUB_REF_NAME}"
            --notes-file ../release_notes.md
            --draft
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" "${args[@]}"
      - name: 核验草稿中鸿蒙资产的实际大小与摘要
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/harmonyos_release.py verify-draft \
            --source-root ../harmonyos-source --artifacts ../outputs/harmonyos
      - name: 发布草稿 Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
      - name: 复核已发布鸿蒙资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/harmonyos_release.py verify-published \
            --source-root ../harmonyos-source --artifacts ../outputs/harmonyos
      - name: 清理 jsDelivr CDN 缓存
        run: |
          curl -s "https://purge.jsdelivr.net/gh/CyrilPeng/venera-next@main/pubspec.yaml" | jq '.status'
          curl -s "https://purge.jsdelivr.net/gh/CyrilPeng/venera-next@main/CHANGELOG.md" | jq '.status'
