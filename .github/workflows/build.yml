name: 构建
run-name: 构建 ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      quality_checked:
        description: '调用方已经通过同一质量检查，仅供复用工作流使用'
        required: false
        type: boolean
        default: false
      build_android:
        required: false
        type: boolean
        default: true
      build_windows:
        required: false
        type: boolean
        default: true
      build_macos:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: false
      build_linux_x64:
        required: false
        type: boolean
        default: true
      build_linux_arm64:
        required: false
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEY_PROPERTIES:
        required: false
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android 手机版和 TV 版'
        required: true
        type: boolean
        default: true
      build_windows:
        description: '构建 Windows'
        required: true
        type: boolean
        default: true
      build_macos:
        description: '构建 macOS'
        required: true
        type: boolean
        default: true
      build_ios:
        description: '构建 iOS'
        required: true
        type: boolean
        default: false
      build_linux_x64:
        description: '构建 Linux x64'
        required: true
        type: boolean
        default: true
      build_linux_arm64:
        description: '构建 Linux ARM64'
        required: true
        type: boolean
        default: true

concurrency:
  group: build-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Manual_Quality:
    if: ${{ inputs.build_android && !inputs.quality_checked }}
    uses: ./.github/workflows/analyze.yml

  Build_Android:
    needs: Manual_Quality
    if: ${{ !cancelled() && inputs.build_android && (needs.Manual_Quality.result == 'success' || needs.Manual_Quality.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [mobile, tv]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: 生成并复核 Android 构建身份
        id: profile
        env:
          ANDROID_FLAVOR: ${{ matrix.flavor }}
        run: python3 .github/scripts/android_tv_build.py metadata --flavor "$ANDROID_FLAVOR" --github-output "$GITHUB_OUTPUT"
      - name: 释放 Android 构建所需磁盘空间
        run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 解码并安装 Android 证书
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$STORE_FILE" | base64 --decode > android/keystore.jks
          echo "$PROPERTY_FILE" > android/key.properties
      - uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android
      - name: 配置 Gradle 插件仓库
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/plugin-repositories.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - run: flutter pub get --enforce-lockfile
      - name: 构建隔离的 Android 安装包
        env:
          ANDROID_FLAVOR: ${{ steps.profile.outputs.flavor }}
          TV_BUILD_LABEL: ${{ steps.profile.outputs.build_label }}
          TV_REVISION: ${{ github.sha }}
        run: |
          if [[ "$ANDROID_FLAVOR" == "tv" ]]; then
            flutter build apk --release --flavor tv \
              --dart-define="TV_BUILD=$TV_BUILD_LABEL" \
              --dart-define="TV_REVISION=$TV_REVISION"
          else
            flutter build apk --release --flavor mobile
          fi
      - name: 验证 Android 分享文件与回调归属
        working-directory: android
        run: ./gradlew :share_plus:testShareOwnership
      - name: 检查 APK 渠道、电视入口、版本码、签名与 ABI
        id: apks
        run: python3 .github/scripts/android_tv_build.py verify --github-output "$GITHUB_OUTPUT"
      - name: 上传 APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor == 'tv' && 'tv-apk-armeabi-v7a' || 'apk-armeabi-v7a' }}
          path: ${{ steps.apks.outputs.apk_armeabi_v7a }}
          if-no-files-found: error
          retention-days: 7
      - name: 上传 APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor == 'tv' && 'tv-apk-arm64-v8a' || 'apk-arm64-v8a' }}
          path: ${{ steps.apks.outputs.apk_arm64_v8a }}
          if-no-files-found: error
          retention-days: 7
      - name: 上传 APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor == 'tv' && 'tv-apk-x86_64' || 'apk-x86_64' }}
          path: ${{ steps.apks.outputs.apk_x86_64 }}
          if-no-files-found: error
          retention-days: 7
      - name: 上传 APK (universal)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor == 'tv' && 'tv-apk-universal' || 'apk-universal' }}
          path: ${{ steps.apks.outputs.apk_universal }}
          if-no-files-found: error
          retention-days: 7
      - name: 上传 Android 构建来源与校验清单
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.flavor }}-manifest
          path: ${{ steps.apks.outputs.manifest }}
          if-no-files-found: error
          retention-days: 7

  Build_Windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 构建 Windows 安装包
        run: |
          flutter pub get --enforce-lockfile
          python windows/build.py
      - name: 验证 Windows 分享请求与 COM 归属
        shell: pwsh
        run: |
          cmake -S packages/share_plus/windows/tests -B build/share-plus-tests -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/share-plus-tests --config Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/share-plus-tests -C Debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 校验 Windows 构建产物
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraNext-*-windows.zip')
          $installer = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraNext-*-windows-installer.exe')
          if ($zip.Count -ne 1) { throw "应当恰好生成一个 Windows zip，实际为 $($zip.Count)。" }
          if ($installer.Count -ne 1) { throw "应当恰好生成一个 Windows 安装包，实际为 $($installer.Count)。" }
          $artifacts = @($zip + $installer)
          $empty = @($artifacts | Where-Object { $_.Length -le 0 })
          if ($empty.Count -gt 0) {
            throw "Windows 构建产物包含空文件：$($empty.Name -join ', ')"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expectedRoot = [System.IO.Path]::GetFileNameWithoutExtension($zip[0].Name)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try {
            $badEntries = @($archive.Entries | Where-Object {
              -not $_.FullName.StartsWith("$expectedRoot/") -and $_.FullName -ne "$expectedRoot/"
            })
            if ($badEntries.Count -gt 0) {
              throw "Windows zip 包含 $expectedRoot/ 之外的文件：$($badEntries.FullName -join ', ')"
            }
            $exeEntry = @($archive.Entries | Where-Object { $_.FullName -eq "$expectedRoot/VeneraNext.exe" })
            if ($exeEntry.Count -ne 1) {
              throw "Windows zip 未包含 $expectedRoot/VeneraNext.exe"
            }
          } finally {
            $archive.Dispose()
          }
          $artifacts | Sort-Object Name | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
      - name: 编译并运行 Windows 原生启动测试
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S windows/tests -B build/windows/startup_tests -A x64
          cmake --build build/windows/startup_tests --config Release
          ctest --test-dir build/windows/startup_tests -C Release --output-on-failure
      - name: 验证 Windows 安装、无头命令与实际启动
        shell: pwsh
        timeout-minutes: 12
        run: |
          $installers = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraNext-*-windows-installer.exe')
          if ($installers.Count -ne 1) { throw '静默安装测试需要恰好一个安装包。' }
          ./.github/scripts/test_windows_startup.ps1 -Installer $installers[0].FullName
      - name: 上传 Windows 启动诊断
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-startup-logs
          path: build/windows/startup-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: windows_build
          path: |
            build/windows/VeneraNext-*-windows.zip
            build/windows/VeneraNext-*-windows-installer.exe
          if-no-files-found: error
          retention-days: 7

  Build_MacOS:
    if: ${{ inputs.build_macos }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin
      - name: 串行化 Rustup 安装操作
        run: |
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          mkdir -p "$HOME/.cargo/bin"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-rustup.lock" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - name: 构建 Flutter macOS 应用
        run: flutter build macos --release
      - name: 创建 DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg_contents
          cp -R build/macos/Build/Products/Release/VeneraNext.app dist/dmg_contents/
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "VeneraNext" -srcfolder dist/dmg_contents -ov -format UDZO "dist/VeneraNext.dmg"
      - name: 将版本号写入文件名
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          mkdir -p result
          mv dist/VeneraNext.dmg "result/VeneraNext-$APP_VERSION.dmg"
      - name: 上传 DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos_build
          path: result/
          if-no-files-found: error
          retention-days: 7

  Build_IOS:
    if: ${{ inputs.build_ios }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin \
            --target aarch64-apple-ios
      - name: 串行化 Rustup 安装操作
        run: |
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          mkdir -p "$HOME/.cargo/bin"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-rustup.lock" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: 构建 iOS 应用
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          IOS_VERSION="${APP_VERSION%%+*}"
          IOS_BUILD="${APP_VERSION#*+}"
          if [ "$IOS_BUILD" = "$APP_VERSION" ]; then
            IOS_BUILD=1
          fi
          IOS_VERSION="${IOS_VERSION%%-*}"
          echo "正在根据 ${APP_VERSION} 构建 iOS 包版本 ${IOS_VERSION}+${IOS_BUILD}"
          flutter build ios --release --no-codesign \
            --build-name "$IOS_VERSION" --build-number "$IOS_BUILD"
      - name: 校验 iOS 原生版本与应用更新渠道
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          IOS_VERSION="${APP_VERSION%%+*}"
          IOS_BUILD="${APP_VERSION#*+}"
          IOS_VERSION="${IOS_VERSION%%-*}"
          APP_BUNDLE="build/ios/iphoneos/Runner.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Info.plist")" = "$IOS_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_BUNDLE/Info.plist")" = "$IOS_BUILD"
          BUNDLED_VERSION=$(sed -n 's/^version:[[:space:]]*//p' "$APP_BUNDLE/Frameworks/App.framework/flutter_assets/pubspec.yaml" | tr -d '\r\n')
          test "$BUNDLED_VERSION" = "$APP_VERSION"
      - name: 创建 IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos/
          zip -r VeneraNext-ios.ipa Payload
      - name: 将版本号写入文件名
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          mkdir -p result
          mv build/ios/iphoneos/VeneraNext-ios.ipa "result/VeneraNext-ios-$APP_VERSION.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: ios_build
          path: result/
          if-no-files-found: error
          retention-days: 7

  Build_Linux_x64:
    if: ${{ inputs.build_linux_x64 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 准备 Rust 工具链
        run: python3 .github/scripts/prepare_rust_toolchain.py
      - run: flutter pub get --enforce-lockfile
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 libwebkit2gtk-4.1-dev libgdk-pixbuf2.0-bin librsvg2-common glib-networking gstreamer1.0-plugins-base gstreamer1.0-plugins-good gsettings-desktop-schemas shared-mime-info adwaita-icon-theme fontconfig-config bubblewrap xdg-dbus-proxy rpm squashfs-tools desktop-file-utils file
      - run: python3 debian/build.py x64
      - name: 构建 RPM 和 AppImage
        run: python3 .github/scripts/build_linux_packages.py --arch x64
      - name: 在无 GTK 和 WebKit 的容器中验证 AppImage
        run: bash .github/scripts/test_appimage.sh x64
      - uses: actions/upload-artifact@v7
        with:
          name: linux_extra_x64
          path: |
            build/linux/x64/packages/*.rpm
            build/linux/x64/packages/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: 构建 Arch 软件包
        run: python3 .github/scripts/build_arch_package.py
      - name: 移除 Arch 调试包
        run: rm -f build/linux/arch/*-debug-*.pkg.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: deb_build
          path: build/linux/x64/release/debian
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: arch_build
          path: build/linux/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  Build_Linux_ARM64:
    if: ${{ inputs.build_linux_arm64 }}
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Flutter does not publish Linux ARM64 SDK archives. Clone the pinned
          # version from Git and let Flutter bootstrap artifacts for this host.
          channel: 'master'
          flutter-version-file: pubspec.yaml
          cache: true
      - name: 准备 Rust 工具链
        run: python3 .github/scripts/prepare_rust_toolchain.py
      - run: flutter pub get --enforce-lockfile
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1 libwebkit2gtk-4.1-dev libgdk-pixbuf2.0-bin librsvg2-common glib-networking gstreamer1.0-plugins-base gstreamer1.0-plugins-good gsettings-desktop-schemas shared-mime-info adwaita-icon-theme fontconfig-config bubblewrap xdg-dbus-proxy rpm squashfs-tools desktop-file-utils file
      - name: 修补字体
        run: dart run patch/font.dart
      - run: python3 debian/build.py arm64
      - name: 构建 RPM 和 AppImage
        run: python3 .github/scripts/build_linux_packages.py --arch arm64
      - name: 在无 GTK 和 WebKit 的容器中验证 AppImage
        run: bash .github/scripts/test_appimage.sh arm64
      - uses: actions/upload-artifact@v7
        with:
          name: linux_extra_arm64
          path: |
            build/linux/arm64/packages/*.rpm
            build/linux/arm64/packages/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: deb_arm64_build
          path: build/linux/arm64/release/debian
          if-no-files-found: error
          retention-days: 7
