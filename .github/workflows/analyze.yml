name: "代码分析"
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  android-jvm:
    name: Android 原生会话与文件所有权
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '17'
      - name: 运行与生产 primitive 同源的 Kotlin 回归
        run: python3 .github/scripts/run_android_jvm_tests.py
      - name: 保存 JVM 编译与运行证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-jvm-test-runs
          path: |
            build/test-audit/android-jvm/*.log
            build/test-audit/android-jvm/summary.json
          if-no-files-found: error
          retention-days: 14

  apple-directory-access:
    name: Apple 目录授权与跨会话恢复
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path apple

  rhttp-native:
    name: Rhttp 原生回调生命周期
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 验证锁定原生源码的取消与回调收尾
        env:
          RUSTFLAGS: --cfg reqwest_unstable
        run: cargo test --locked --manifest-path packages/rhttp/rust/Cargo.toml --lib
      - name: 编译 Flutter 测试使用的 Rhttp 库
        env:
          RUSTFLAGS: --cfg reqwest_unstable
        run: cargo build --locked --manifest-path packages/rhttp/rust/Cargo.toml --lib
      - uses: actions/upload-artifact@v7
        with:
          name: linux-rhttp-test-library
          path: packages/rhttp/rust/target/debug/librhttp.so
          if-no-files-found: error
          retention-days: 1

  rhttp-ios:
    name: iOS Rhttp 原生依赖兼容性
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: 准备 iOS Rust 工具链
        run: python3 .github/scripts/prepare_rust_toolchain.py --target aarch64-apple-ios
      - name: 验证锁定原生依赖可用于 iOS
        env:
          RUSTFLAGS: --cfg reqwest_unstable
        run: |
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          cargo check --locked --manifest-path packages/rhttp/rust/Cargo.toml --target aarch64-apple-ios --lib

  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: python3 .github/scripts/release_version.py --check
      - run: python3 .github/scripts/check_structure_imports.py
      - run: python3 .github/scripts/check_architecture_dependencies.py
      - name: 核对测试文件与执行清单
        run: python3 .github/scripts/test_suites.py --strict-imports --output build/test-audit/inventory.json
      - run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"
      - name: 保存测试清单
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-inventory
          path: build/test-audit/inventory.json
          if-no-files-found: error
          retention-days: 14
      - run: flutter pub get --enforce-lockfile
      - name: 准备并验证独立代码审查工具
        working-directory: tool/code_audit
        run: |
          dart pub get --enforce-lockfile
          dart run bin/self_check.dart
          dart analyze --fatal-infos
      - name: 验证 Git 与本地依赖来源、许可证及补丁记录
        run: dart tool/check_git_dependencies.dart
      - name: 检查本次修改的 Dart 格式
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ -n "${BASE_SHA:-}" ]]; then
            diff_range="${BASE_SHA}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          mapfile -t dart_files < <(git diff --diff-filter=ACMRTUXB --name-only "$diff_range" -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "本次没有修改 Dart 文件。"
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"
      - run: flutter analyze --no-pub --fatal-infos --fatal-warnings

  flutter-fast:
    name: 快速 Flutter 回归
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VENERA_REQUIRE_NATIVE_TEST_LIBRARIES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 提早运行不依赖原生库的完整快速组
        run: >-
          python3 .github/scripts/run_flutter_tests.py --partition fast --concurrency 4
          --coverage --coverage-path build/test-audit/fast/lcov.info
          --output build/test-audit/fast
      - name: 保存快速组的原始事件与覆盖率
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-default-fast
          path: build/test-audit/fast/
          if-no-files-found: error
          retention-days: 14

  flutter-native:
    name: Flutter 原生库与内存安全
    needs: rhttp-native
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VENERA_REQUIRE_NATIVE_TEST_LIBRARIES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: linux-rhttp-test-library
          path: build/test-native/lib
      - name: 准备 Linux 原生测试库
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsqlite3-dev
          python3 .github/scripts/prepare_linux_test_libraries.py
      - name: 验证原生编码与归档 ABI 的内存安全
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S packages/venera_native/src -B build/native-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DVENERA_NATIVE_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/native-sanitizers --parallel 2
          ctest --test-dir build/native-sanitizers --output-on-failure
      - name: 验证文档存储句柄、64 位操作与内存安全
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S packages/venera_saf/src -B build/saf-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DVENERA_SAF_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/saf-sanitizers --parallel 2
          ctest --test-dir build/saf-sanitizers --output-on-failure
      - name: 保存已验证的共享测试库
        uses: actions/upload-artifact@v7
        with:
          name: linux-flutter-test-libraries
          path: build/test-native/lib/
          if-no-files-found: error
          retention-days: 1

  flutter-full:
    name: Flutter 全量回归（${{ matrix.partition }}）
    needs: flutter-native
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [shard-1, shard-2, shard-3]
    env:
      VENERA_REQUIRE_NATIVE_TEST_LIBRARIES: '1'
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/test-native/lib
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: linux-flutter-test-libraries
          path: build/test-native/lib
      - name: 核对实际库文件与摘要并加载必需 ABI
        run: python3 .github/scripts/prepare_linux_test_libraries.py --verify-only
      - name: 运行完整分片并保留独立覆盖率
        run: >-
          python3 .github/scripts/run_flutter_tests.py --partition "${{ matrix.partition }}" --concurrency 4
          --coverage --coverage-path "build/test-audit/${{ matrix.partition }}/lcov.info"
          --output "build/test-audit/${{ matrix.partition }}"
      - name: 保存每个分片的原始事件与覆盖率
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-default-${{ matrix.partition }}
          path: build/test-audit/${{ matrix.partition }}/
          if-no-files-found: error
          retention-days: 14

  flutter-tv:
    name: TV 编译身份、遥控器与低内存策略
    needs: flutter-native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VENERA_REQUIRE_NATIVE_TEST_LIBRARIES: '1'
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/test-native/lib
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: linux-flutter-test-libraries
          path: build/test-native/lib
      - name: 核对实际库文件与摘要并加载必需 ABI
        run: python3 .github/scripts/prepare_linux_test_libraries.py --verify-only
      - name: 使用真实 TV flavor 及清单参数执行
        run: python3 .github/scripts/run_flutter_tests.py --suite tv --output build/test-audit/tv
      - name: 保存独立 TV 运行证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-tv-test-runs
          path: build/test-audit/tv/
          if-no-files-found: error
          retention-days: 14

  flutter-tests:
    name: Flutter 测试与覆盖率
    if: ${{ always() }}
    needs: [flutter-fast, flutter-native, flutter-full, flutter-tv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: flutter-default-*
          path: build/test-audit/collected
          merge-multiple: false
      - uses: actions/download-artifact@v8
        with:
          name: flutter-tv-test-runs
          path: build/test-audit/collected/flutter-tv-test-runs
      - name: 严格核对全部结果、完整并集及合并覆盖率
        if: ${{ always() }}
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 .github/scripts/aggregate_flutter_tests.py --reports build/test-audit/collected
          --coverage-output coverage/lcov.info --github-summary
      - name: 保存普通平台原始记录与完整汇总
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-runs
          path: build/test-audit/
          if-no-files-found: error
          retention-days: 14
      - name: 汇总合并后的 Dart 覆盖率
        run: python3 .github/scripts/report_dart_coverage.py coverage/lcov.info --github-summary
      - name: 上传完整 Dart 覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  android-saf-provider:
    name: Android 文档存储真实 Provider 回归
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 准备隔离 Provider 与混淆后的 Release 消费端
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;28.0.13004108" "cmake;3.22.1"
          python3 tool/saf_provider_probe/prepare_probe.py --flutter "$(command -v flutter)" --sdk "$ANDROID_HOME" --build
          python3 .github/scripts/check_saf_bundle.py --root build/dependency-followup/saf/android-probe/consumer/build/app/outputs/flutter-apk
      - name: 启用模拟器硬件加速
        run: sudo chmod a+rw /dev/kvm
      - name: 验证持久授权、Unicode、64 位文件与关闭协议
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: python3 tool/saf_provider_probe/prepare_probe.py --flutter "$(command -v flutter)" --sdk "$ANDROID_HOME" --run --serial emulator-5554
      - name: 保存 Provider 运行证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-saf-provider-evidence
          path: |
            build/dependency-followup/saf/android-probe/*.log
            build/dependency-followup/saf/android-probe/provider-probe.json
          if-no-files-found: error
          retention-days: 7
