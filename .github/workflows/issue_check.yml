name: 检查 Issue

on:
  issues:
    types: [opened]

concurrency:
  group: issue-check-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: 检查 Issue
    if: ${{ vars.ENABLE_AI_ISSUE_CHECK == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 使用 AI 检查 Issue
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_CHECK_MODEL: ${{ vars.ISSUE_CHECK_MODEL || 'gpt-4o' }}
        run: python3 .github/scripts/check_issue.py
