name: PR 平台冒烟构建
run-name: "PR 平台冒烟构建 #${{ github.event.pull_request.number }}"

on:
  pull_request:

concurrency:
  group: pr-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 检测平台构建变更
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.changed.outputs.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 判断是否需要平台构建
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --)"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq \
            '^(lib/|assets/|android/|windows/|ios/|macos/|linux/|debian/|patch/|\.github/workflows/|\.github/scripts/|pubspec\.yaml$|pubspec\.lock$|rust-toolchain\.toml$|analysis_options\.yaml$)'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android 冒烟构建
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - run: flutter pub get --enforce-lockfile
      - name: 构建 Android Debug APK
        run: flutter build apk --debug --target-platform android-arm64

  windows:
    name: Windows 冒烟构建
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 构建 Windows Debug 应用
        run: flutter build windows --debug

  platform_gate:
    name: 平台冒烟构建门禁
    needs: [changes, android, windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总平台构建结果
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || \
                ("$ANDROID_RESULT" != "success" && "$ANDROID_RESULT" != "skipped") || \
                ("$WINDOWS_RESULT" != "success" && "$WINDOWS_RESULT" != "skipped") ]]; then
            echo "平台冒烟构建未通过：changes=$CHANGES_RESULT android=$ANDROID_RESULT windows=$WINDOWS_RESULT"
            exit 1
          fi
          echo "平台冒烟构建通过：Android=$ANDROID_RESULT Windows=$WINDOWS_RESULT"
