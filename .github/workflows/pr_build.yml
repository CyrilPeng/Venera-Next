name: PR 平台冒烟构建
run-name: "PR 平台冒烟构建 #${{ github.event.pull_request.number }}"

on:
  pull_request:

concurrency:
  group: pr-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 检测平台构建变更
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.changed.outputs.platform }}
      desktop: ${{ steps.changed.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 判断是否需要平台构建
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --)"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq \
            '^(lib/|packages/|assets/|android/|apple/|windows/|ios/|macos/|linux/|debian/|patch/|\.github/workflows/|\.github/scripts/|pubspec\.yaml$|pubspec\.lock$|rust-toolchain\.toml$|analysis_options\.yaml$)'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq \
            '^(packages/[^/]+/(linux|macos|windows|src)/|linux/|macos/|pubspec\.(yaml|lock)$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: ${{ matrix.flavor == 'tv' && 'Android TV 冒烟构建' || 'Android 冒烟构建' }}
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [mobile, tv]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 准备临时 Android Debug 签名
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          printf '%s\n' \
            'storePassword=android' \
            'keyPassword=android' \
            'keyAlias=androiddebugkey' \
            'storeFile=../debug.keystore' \
            > android/key.properties
      - run: flutter pub get --enforce-lockfile
      - name: 构建 Android Debug APK
        env:
          ANDROID_FLAVOR: ${{ matrix.flavor }}
        run: flutter build apk --debug --flavor "$ANDROID_FLAVOR" --target-platform android-arm,android-arm64,android-x64
      - name: 验证 Android 原生编码包与第三方声明
        env:
          ANDROID_FLAVOR: ${{ matrix.flavor }}
        run: python3 .github/scripts/check_native_codec_bundle.py --platform android --root "build/app/outputs/apk/$ANDROID_FLAVOR/debug"
      - name: 验证 Android 文档存储 ABI 与声明
        env:
          ANDROID_FLAVOR: ${{ matrix.flavor }}
        run: python3 .github/scripts/check_saf_bundle.py --root "build/app/outputs/apk/$ANDROID_FLAVOR/debug"

  windows:
    name: Windows 冒烟构建
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 构建 Windows Debug 应用
        run: flutter build windows --debug
      - name: 验证桌面 WebView 第三方声明随应用分发
        shell: pwsh
        run: |
          $source = 'packages/desktop_webview_window/WINDOWS_THIRD_PARTY_NOTICES.txt'
          $packaged = 'build/windows/x64/runner/Debug/WINDOWS_THIRD_PARTY_NOTICES.txt'
          if (!(Test-Path -LiteralPath $packaged) -or
              (Get-FileHash -LiteralPath $source).Hash -ne
              (Get-FileHash -LiteralPath $packaged).Hash) {
            throw '桌面 WebView 第三方声明缺失或与审核源码不一致。'
          }
      - name: 验证 Windows 原生编码包、声明与实际导入
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/check_native_codec_bundle.py --platform windows --root build/windows/x64/runner/Debug
          $env:VENERA_NATIVE_TEST_DIRECTORY = Join-Path $PWD 'build/windows/x64/runner/Debug'
          $env:PATH = $env:VENERA_NATIVE_TEST_DIRECTORY + ';' + $env:PATH
          $env:VENERA_NATIVE_TEST_LIBRARY = Join-Path $PWD 'build/windows/x64/runner/Debug/venera_native.dll'
          flutter test --no-pub --reporter expanded `
            test/foundation/native_codecs_test.dart `
            test/foundation/image_processing_native_test.dart `
            test/foundation/reader_image_processing_native_test.dart `
            test/foundation/js_engine_lifecycle_test.dart `
            test/foundation/js_native_contract_test.dart `
            test/foundation/js_owned_result_test.dart `
            test/foundation/js_result_descendants_test.dart
      - name: 验证 Windows 网页代理与登录生命周期
        shell: pwsh
        timeout-minutes: 5
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = (Join-Path $PWD 'build/windows/x64/runner/Debug') + ';' + $env:PATH
          flutter test --no-pub --reporter expanded `
            test/routing/windows_webview_environment_test.dart `
            test/routing/windows_webview_proxy_test.dart `
            test/routing/webview_menu_test.dart `
            test/features/comic_source/source_web_login_test.dart
      - name: 编译并运行 Windows 原生启动测试
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S windows/tests -B build/windows/startup_tests -A x64
          cmake --build build/windows/startup_tests --config Debug
          ctest --test-dir build/windows/startup_tests -C Debug --output-on-failure
      - name: 验证 Windows 首次启动、重复启动和失败诊断
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/scripts/test_windows_startup.ps1 -Application build/windows/x64/runner/Debug/VeneraNext.exe
      - name: 上传 Windows 启动诊断
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-pr-startup-logs
          path: build/windows/startup-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: ${{ matrix.platform }} 原生构建
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            target: linux
            architecture: x64
          - platform: macOS
            runner: macos-15
            target: macos
            architecture: arm64
          - platform: iOS
            runner: macos-15
            target: ios
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: ${{ matrix.architecture }}
          cache: true
      - name: 准备 Linux 原生构建依赖
        if: ${{ matrix.target == 'linux' }}
        timeout-minutes: 8
        run: |
          sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu|' \
            /etc/apt/sources.list.d/ubuntu.sources
          test "$(awk '/^URIs:/ {print $2}' /etc/apt/sources.list.d/ubuntu.sources | sort -u)" \
            = 'https://archive.ubuntu.com/ubuntu'
          sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 install -y --no-install-recommends \
            ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsqlite3-dev
      - name: 准备 Linux Rust 工具链
        if: ${{ matrix.target == 'linux' }}
        run: python3 .github/scripts/prepare_rust_toolchain.py
      - name: 准备 macOS 原生工具链
        if: ${{ matrix.target != 'linux' }}
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-apple-darwin --target x86_64-apple-darwin \
            --target aarch64-apple-ios --target aarch64-apple-ios-sim --target x86_64-apple-ios
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          mkdir -p "$HOME/.cargo/bin"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-rustup.lock" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: 编译桌面应用及全部原生插件
        if: ${{ matrix.target != 'ios' }}
        run: flutter build ${{ matrix.target }} --debug
      - name: 编译 iOS 模拟器应用及全部原生插件
        if: ${{ matrix.target == 'ios' }}
        run: flutter build ios --simulator --debug --no-codesign
      - name: 验证原生编码导出与随包声明
        env:
          BUNDLE_PLATFORM: ${{ matrix.target }}
          BUNDLE_ROOT: ${{ matrix.target == 'linux' && 'build/linux/x64/debug/bundle' || matrix.target == 'macos' && 'build/macos/Build/Products/Debug' || 'build/ios/iphonesimulator' }}
        run: python3 .github/scripts/check_native_codec_bundle.py --platform "$BUNDLE_PLATFORM" --root "$BUNDLE_ROOT"

  platform_gate:
    name: 平台冒烟构建门禁
    needs: [changes, android, windows, desktop]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总平台构建结果
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PLATFORM_REQUIRED: ${{ needs.changes.outputs.platform }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          ANDROID_RESULT: ${{ needs.android.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || \
                ("$PLATFORM_REQUIRED" == "true" && ("$ANDROID_RESULT" != "success" || "$WINDOWS_RESULT" != "success")) || \
                ("$DESKTOP_REQUIRED" == "true" && "$DESKTOP_RESULT" != "success") || \
                ("$ANDROID_RESULT" != "success" && "$ANDROID_RESULT" != "skipped") || \
                ("$WINDOWS_RESULT" != "success" && "$WINDOWS_RESULT" != "skipped") || \
                ("$DESKTOP_RESULT" != "success" && "$DESKTOP_RESULT" != "skipped") ]]; then
            echo "平台冒烟构建未通过：changes=$CHANGES_RESULT android=$ANDROID_RESULT windows=$WINDOWS_RESULT desktop=$DESKTOP_RESULT"
            exit 1
          fi
          echo "平台冒烟构建通过：Android 手机版与 TV 版=$ANDROID_RESULT Windows=$WINDOWS_RESULT Linux／macOS／iOS=$DESKTOP_RESULT"
