version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dart-production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      dart-development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # rhttp 0.18+ requires a newer flutter_rust_bridge than this project pins.
      - dependency-name: rhttp
        versions: [">= 0.18.0"]
      # 0.6.x is an end-of-life placeholder for the sqlite3 3.x migration.
      - dependency-name: sqlite3_flutter_libs
        versions: [">= 0.6.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Wait for a Dart analyzer action release that runs on Node.js 24.
      - dependency-name: invertase/github-action-dart-analyzer
        versions: [">= 2.0.0"]
