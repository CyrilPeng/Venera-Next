name: venera_native
description: Project-owned PNG encoding and 7z decoding with audited native cores.
version: 1.0.0
publish_to: none
homepage: https://github.com/CyrilPeng/Venera-Next

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  path: ^1.9.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
